server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache for a year.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed assets (screenshots, favicon, Open Graph card): cache briefly.
    location ~* \.(?:css|js|woff2|jpg|jpeg|png|webp|svg|ico|txt|xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Pages: always revalidate, so a new deploy shows at once.
    location / {
        expires epoch;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
        expires epoch;
    }
}
